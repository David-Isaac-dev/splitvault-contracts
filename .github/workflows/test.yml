name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.package }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Verify testnet deployment manifest fixture
        run: bash scripts/test-testnet-deployment-manifest.sh

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Storage key snapshot test
        run: cargo test --locked -p split storage_snapshot

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all -- --check

  fuzz:
    name: Fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_create_invoice
          - fuzz_pay
          - fuzz_release
          - fuzz_refund
          - fuzz_sequence
          - fuzz_fee_deduct
          - fuzz_ratio_validation
          - fuzz_split_arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: |
          cargo install --locked --version 0.13.2 cargo-fuzz
          cargo fuzz --version

      - name: Check locked fuzz dependencies
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

          for doc in "${docs[@]}"; do
            dir=$(dirname "$doc")
            # Extract link targets from inline Markdown links: [text](target)
            while IFS= read -r target; do
              [ -z "$target" ] && continue

              # Skip external HTTP(S) URLs (offline-safe).
              case "$target" in
                http://*|https://*|mailto:*|tel:*|ftp://*) continue ;;
              esac

              # Split off any anchor fragment.
              path="${target%%#*}"
              anchor=""
              if [ "$target" != "$path" ]; then
                anchor="${target#*#}"
              fi

              # Resolve the target path relative to the document.
              if [ -z "$path" ]; then
                resolved="$doc"
              else
                resolved="$dir/$path"
              fi

              if [ ! -e "$resolved" ]; then
                echo "::error file=$doc::Missing link target '$target' (resolved to '$resolved')"
                fail=1
                continue
              fi

              # Validate heading anchors for Markdown targets.
              if [ -n "$anchor" ] && [ -f "$resolved" ]; then
                case "$resolved" in
                  *.md)
                    if ! anchors_of "$resolved" | grep -Fxq "$anchor"; then
                      echo "::error file=$doc::Missing heading anchor '#$anchor' in '$resolved'"
                      fail=1
                    fi
                    ;;
                esac
              fi
            done < <(grep -oE '\]\([^)]+\)' "$doc" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//' \
              | sed -E 's/[[:space:]]+"[^"]*"$//')
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Markdown link check failed."
            exit 1
          fi
          echo "All repository-owned Markdown links are valid."

  rustdoc:
    name: Build rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rustdoc-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation for workspace libraries
        run: cargo doc --workspace --no-deps

      - name: Run doctests
        run: cargo test --workspace --doc
