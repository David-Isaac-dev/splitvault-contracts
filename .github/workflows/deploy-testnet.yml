name: Deploy to Testnet

on:
  workflow_dispatch:
    inputs:
      usdc_token:
        description: Testnet USDC token contract address
        required: true
        type: string

concurrency:
  group: deploy-testnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --version 28.1.0

      - name: Build contract (release)
        run: stellar contract build --package split

      - name: Configure testnet identity
        run: stellar keys generate deployer --network testnet

      - name: Fund deployer account via Friendbot
        run: |
          ADDR=$(stellar keys address deployer)
          echo "Funding $ADDR via Friendbot..."
          curl -s -f "https://friendbot.stellar.org?addr=$ADDR" > /dev/null
          echo "Account funded."

      - name: Deploy contract
        shell: bash
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/split.wasm \
            --source deployer \
            --network testnet)
          echo "Deployed contract $contract_id"
          bash scripts/testnet-deployment-manifest.sh "$contract_id" "$GITHUB_SHA" "$wasm" \
            > testnet-deployment.json

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: testnet-deployment.json
          if-no-files-found: error
