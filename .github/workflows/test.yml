name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 0

jobs:
  ci-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CI replay and size reporting
        run: python3 scripts/test-ci.py -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.package }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Verify testnet deployment manifest fixture
        run: bash scripts/test-testnet-deployment-manifest.sh

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Storage key snapshot test
        run: cargo test --locked -p split storage_snapshot

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all -- --check

  fuzz:
    name: Fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_create_invoice
          - fuzz_pay
          - fuzz_release
          - fuzz_refund
          - fuzz_sequence
          - fuzz_fee_deduct
          - fuzz_ratio_validation
          - fuzz_split_arithmetic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_create_invoice, fuzz_pay, fuzz_release, fuzz_refund, fuzz_sequence]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: |
          cargo install --locked --version 0.13.2 cargo-fuzz
          cargo fuzz --version

      - name: Check locked fuzz dependencies
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      - name: Fuzz ${{ matrix.target }} (60s)
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: bash scripts/run-fuzz.sh "$FUZZ_TARGET"

      - name: Upload fuzz failure and replay context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}-${{ github.run_attempt }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
