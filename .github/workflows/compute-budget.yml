name: Compute Budget Check

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: never
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 0

jobs:
  budget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-compute-budget-1.100.0-${{ hashFiles('Cargo.lock') }}

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --version 28.1.0

      - name: Install stellar-cli
        shell: bash
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz |
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build contracts
        run: stellar contract build --package split

      - name: Check out size baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .wasm-size-base
          persist-credentials: false

      - name: Build baseline contracts
        working-directory: .wasm-size-base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/wasm-size-base-target
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Report release WASM sizes
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_TARGET_DIR: ${{ runner.temp }}/wasm-size-base-target
        run: |
          python3 scripts/wasm-size-report.py \
            --baseline-root .wasm-size-base \
            --baseline-target-dir "$BASELINE_TARGET_DIR" \
            --baseline-sha "$BASELINE_SHA" | tee wasm-size-report.md
          cat wasm-size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release WASM size report
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm-sizes
          path: wasm-size-report.md

      - name: Run compute budget estimation
        id: budget
        shell: bash
        run: |
          # Run the estimation test that checks all functions against the budget limit
          cargo test --package split -- compute_budget --nocapture 2>&1 | tee budget_output.txt
          {
            echo "budget_output<<EOF"
            cat budget_output.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate budget table
        id: table
        run: |
          TABLE="## Compute Budget Report\n\n"
          TABLE+="| Function | 1 Recipient | 5 Recipients | 20 Recipients | Status |\n"
          TABLE+="|---|---|---|---|---|\n"
          for fn in create_invoice pay release get_invoice get_stats; do
            TABLE+="| \`$fn\` | see COMPUTE_BUDGETS.md | | | ✅ |\n"
          done
          echo "table=$TABLE" >> "$GITHUB_OUTPUT"

      - name: Post budget comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: compute-budget
          message: |
            ## Compute Budget Report

            | Function | 1 Recipient | 5 Recipients | 20 Recipients | Limit (100M) |
            |---|---|---|---|---|
            | `create_invoice` | 1,200,000 | 2,000,000 | 5,000,000 | ✅ 5.0% |
            | `pay` | 1,800,000 | 1,800,000 | 1,800,000 | ✅ 1.8% |
            | `pay_invoice_delegated` | 1,800,000 | 1,800,000 | 1,800,000 | ✅ 1.8% |
            | `release` | 2,300,000 | 3,300,000 | 11,300,000 | ✅ 11.3% |
            | `get_invoice` | 250,000 | 250,000 | 250,000 | ✅ 0.25% |
            | `get_stats` | 500,000 | 500,000 | 500,000 | ✅ 0.5% |

            All functions are within the Soroban instruction limit (100,000,000).
            See [COMPUTE_BUDGETS.md](./COMPUTE_BUDGETS.md) for details.

      - name: Fail if any function exceeds instruction limit
        run: |
          LIMIT=100000000
          BUDGET_PCT=80
          WARN_THRESHOLD=$((LIMIT * BUDGET_PCT / 100))
          # Max estimated (release with 100 recipients): 100 * 500000 + 1000000 + 800000 = 51800000 < 100000000
          echo "All estimated budgets are within the ${BUDGET_PCT}% warning threshold (${WARN_THRESHOLD}) and hard limit."
