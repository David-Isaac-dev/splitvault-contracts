name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: Build production WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all contract WASM packages
        run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name')
          for pkg in $members; do
            echo "::group::Building $pkg"
            cargo build --release --target wasm32-unknown-unknown -p "$pkg"
            echo "::endgroup::"
          done

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name')
          count=0
          for pkg in $members; do
            artifact="target/wasm32-unknown-unknown/release/${pkg//-/_}.wasm"
            if [ ! -f "$artifact" ]; then
              echo "::error::Missing WASM artifact for $pkg at $artifact"
              exit 1
            fi
            echo "Found $artifact"
            count=$((count + 1))
          done
          if [ "$count" -ne 5 ]; then
            echo "::error::Expected 5 WASM artifacts, found $count"
            exit 1
          fi
