[package]
name = "split"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
dashboard = { path = "../dashboard", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
# The direct testnet deploy uses an atomic constructor. Factory builds keep their existing ABI.
testnet-constructor = []
